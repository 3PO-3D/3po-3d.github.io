# Portfolio work pieces. Add an entry to add a piece. `key` must match the folder
# under assets/img/portfolio/<key>/ (stills are no longer shown on the page; kept for reference).
# `framerate` = Framerate embed UUID (the video is embedded on the page, always visible).
# `crop_to: matte`  = picture is only the centred 56% of a square frame (black matte): zoom in to fill the box.
# `crop_to: pillar` = square picture in a 16:9 frame (black side bars): crop to the square (also set vaspect "1 / 1").
# `autoplay: false` = start paused (default is muted autoplay loop). `behance_url` / `instagram_url` / `framerate_watch` are optional outbound links.
# `details` = list of { name, desc } shown in the dropdown; `credits` = thank-you line (names, not handles).
# ORDER = display order: newest first.

- key: continuum_study
  title: "Continuum: Study 01"
  category: "3D Animation"
  instagram_url: "https://www.instagram.com/reel/DbnkSS8OmTh/"
  framerate: "1ed0d354-1b4a-4ff8-a096-f366df1ddf28"
  framerate_watch: "https://framerate.tv/watch/jDrgpa9b"
  crop_to: pillar
  vaspect: "1 / 1"
  blurb: >
    A 120-frame loop that started life as a quick exercise and grew from there. Rather than a
    product shot, I aimed for a graphic-design feel: flat angles, hard shadows and one soft,
    glowing element in the middle. No piece is ever truly finished — this is where I stopped.
  details:
    - { name: "Animation", desc: "120-frame loop, fully keyframed, no simulations." }
    - { name: "The marble", desc: "The bounce and roll are the whole point — if it doesn't feel like it has weight, nothing else works. Most of the time went into roughly eight frames." }
    - { name: "Materials", desc: "As simple as they can be. The tubes aren't glass: no transmission, just opacity — no refraction, no caustics, and faster renders. The aim was to stop the eye wandering over material detail on background surfaces, so there are no scratch or smudge textures, only gradients to break up a colour or guide the eye." }
    - { name: "Composition", desc: "There isn't a single 0° line in the scene. Everything sits on one angle and the shadows run on another. The track is meant to feel endless, so nothing is allowed to act as a horizon for the eye to lock onto." }
    - { name: "Colour", desc: "Everything is grey, or close to it. The only colour comes from two lights, which are also the only soft thing in an otherwise hard scene. That's deliberate: the hero gets the soft treatment, everything else gets edges." }
    - { name: "Sound", desc: "A touch of sci-fi, with a small amount of sound design, just enough to tie the scene together." }
  credits: >
    Thanks again to Oscar Peterson — the marble jump idea came straight from watching his work.
    Thanks to Daniel Meszaros (Subvertex) for constantly showing me things that make me want to
    open Cinema 4D late at night. The background and scene setup were heavily inspired by
    Peter Tarka — not claiming I got close, but that's where I was aiming.

