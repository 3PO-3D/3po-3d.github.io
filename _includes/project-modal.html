<!-- Shared "Start a project" popup — animation / studio intake.
     Any element with [data-open-project] opens it. Text comes from
     _data/i18n.yml[page.lang].project_modal; posts to the unified intake
     webhook with workflows=Animation + lang so Make routes + localizes.
     Self-contained (own styles via global CSS vars) so it drops onto any page. -->
{% assign pm = site.data.i18n[page.lang].project_modal %}
<style>
  #project-modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 1.25rem; background: rgba(var(--text-rgb), 0.45); backdrop-filter: blur(4px); }
  #project-modal[hidden] { display: none; }
  #project-modal .pm-box { position: relative; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; background: var(--surface); border: var(--bw) solid var(--text); border-radius: var(--radius); padding: 2rem; }
  #project-modal .pm-close { position: absolute; top: 0.5rem; right: 0.6rem; background: transparent; border: none; font-size: 1.7rem; line-height: 1; color: var(--muted); cursor: pointer; padding: 0.3rem 0.5rem; }
  #project-modal .pm-close:hover { color: var(--text); }
  #project-modal .pm-field { margin-bottom: 1rem; }
  #project-modal .pm-field label { display: block; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  #project-modal .pm-field input, #project-modal .pm-field textarea { width: 100%; font-family: var(--font-body); font-size: 0.95rem; padding: 0.6rem 0.75rem; border: var(--bw) solid var(--hairline); border-radius: var(--radius); background: var(--bg); color: var(--text); }
  #project-modal .pm-field input:focus, #project-modal .pm-field textarea:focus { outline: none; border-color: var(--accent); }
  #project-modal .pm-field textarea { min-height: 92px; resize: vertical; }
  #project-modal .pm-note { display: block; font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.04em; color: var(--muted); line-height: 1.5; margin-top: 0.7rem; }
  #project-modal .pm-check { width: 46px; height: 46px; margin: 0 auto 1rem; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; }
  #project-modal .pm-check svg { width: 24px; height: 24px; }
  #project-modal .pm-hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
</style>

<div id="project-modal" data-lang="{{ page.lang | default: 'en' }}" hidden>
  <div class="pm-box" role="dialog" aria-modal="true" aria-label="{{ pm.heading }}">
    <button class="pm-close" type="button" aria-label="Close">&times;</button>

    <div class="pm-form">
      <p class="mono-label" style="margin-bottom:0.5rem;">{{ pm.eyebrow }}</p>
      <h2 style="font-size:1.5rem;margin:0 0 0.6rem;">{{ pm.heading }}</h2>
      <p style="color:var(--muted);line-height:1.6;margin:0 0 1.5rem;">{{ pm.intro }}</p>

      <form id="project-form" novalidate>
        <input type="text" name="of_hp_field" class="pm-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="pm-field"><label for="pm-name">{{ pm.name_label }}</label><input type="text" id="pm-name" name="name" placeholder="{{ pm.name_ph }}" autocomplete="name"></div>
        <div class="pm-field"><label for="pm-email">{{ pm.email_label }}</label><input type="email" id="pm-email" name="email" placeholder="you@email.com" autocomplete="email" required></div>
        <div class="pm-field"><label for="pm-notes">{{ pm.note_label }} <span style="text-transform:none;letter-spacing:0;opacity:.7;">{{ pm.note_optional }}</span></label><textarea id="pm-notes" name="notes" placeholder="{{ pm.note_ph }}"></textarea></div>
        <button class="btn btn-accent" type="submit" id="pm-submit">{{ pm.submit }}</button>
        <span class="pm-note">{{ pm.submit_note }}</span>
        <p class="pm-note" id="pm-err" hidden style="color:#b3261e;"></p>
      </form>
    </div>

    <div class="pm-done" id="pm-done" hidden style="text-align:center;">
      <div class="pm-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg></div>
      <h3 style="margin:0 0 0.5rem;">{{ pm.done_heading }}</h3>
      <p style="color:var(--muted);line-height:1.6;">{{ pm.done_body }}</p>
    </div>
  </div>
</div>

<script>
(function () {
  function init() {
    var overlay = document.getElementById('project-modal');
    if (!overlay) return;
    var STR = {{ pm | jsonify }};
    var LANG = overlay.getAttribute('data-lang') || 'en';
    var form = document.getElementById('project-form');
    var formWrap = overlay.querySelector('.pm-form');
    var done = document.getElementById('pm-done');
    var errBox = document.getElementById('pm-err');
    var WEBHOOK = 'https://hook.eu1.make.com/u91iw4wqrdqdnjydmg2ttsi56y15c1a9';
    var EMPTIES = ['phone','ship_country','ship_postcode','ship_city','ship_street','ship_number','ship_unit','deadline','material_name','material_type','material_colour','material_id','quantity','fdm_size','fdm_finishing','fdm_finishing_notes','scan_note','model_note','animation_note','shoe_size','foot_length','foot_width'];

    function open() { overlay.removeAttribute('hidden'); document.body.style.overflow = 'hidden'; }
    function close() { overlay.setAttribute('hidden', ''); document.body.style.overflow = ''; }
    function reset() { if (form) form.reset(); if (formWrap) formWrap.style.display = ''; if (done) done.hidden = true; if (errBox) errBox.hidden = true; }

    document.querySelectorAll('[data-open-project]').forEach(function (el) {
      el.addEventListener('click', function (e) { e.preventDefault(); reset(); open(); });
    });
    overlay.querySelector('.pm-close').addEventListener('click', close);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hasAttribute('hidden')) close(); });

    if (form) form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (form.of_hp_field && form.of_hp_field.value) { close(); return; }
      var email = (form.email.value || '').trim();
      if (!email) { errBox.hidden = false; errBox.textContent = STR.err_email; return; }
      errBox.hidden = true;
      var data = new URLSearchParams();
      data.append('form_type', 'service');
      data.append('_secret', 'forge3po');
      data.append('lang', LANG);
      data.append('workflows', 'Animation');
      data.append('cart', 'Animation & 3D Art');
      data.append('name', (form.name.value || '').trim());
      data.append('email', email);
      data.append('notes', (form.notes.value || '').trim());
      EMPTIES.forEach(function (n) { if (!data.has(n)) data.append(n, ''); });
      var btn = document.getElementById('pm-submit');
      var orig = btn.textContent; btn.disabled = true; btn.textContent = STR.sending;
      fetch(WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: data.toString() })
        .then(function (r) {
          btn.disabled = false; btn.textContent = orig;
          if (!r.ok) throw new Error('the server returned ' + r.status);
          if (formWrap) formWrap.style.display = 'none';
          if (done) done.hidden = false;
        })
        .catch(function () {
          btn.disabled = false; btn.textContent = orig;
          errBox.hidden = false; errBox.textContent = STR.err_send;
        });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
