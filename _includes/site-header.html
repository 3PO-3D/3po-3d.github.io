<header class="site-header">
  <div class="header-container">
    <div class="logo-carousel" id="logo-carousel" aria-label="3PO collection">
      <a class="logo-carousel__item{% if page.nav_key == 'home' %} is-active{% endif %}" href="{{ '/' | relative_url }}" aria-label="3PO Home">
        <img src="{{ '/assets/img/logos/Main_page/V0_3PO_LOGO-HEAD_WHITEFILL_SVG.svg' | relative_url }}" alt="3PO"></a>
      <a class="logo-carousel__item{% if page.nav_key == 'chronos' %} is-active{% endif %}" href="{{ '/chronos/' | relative_url }}" aria-label="CHRONOS">
        <img src="{{ '/assets/img/logos/Chronos/chronos_head_whitefill.svg' | relative_url }}" alt="CHRONOS"></a>
      <a class="logo-carousel__item{% if page.nav_key == 'forge' %} is-active{% endif %}" href="{{ '/forge/' | relative_url }}" aria-label="FORGE — 3D Printing">
        <img src="{{ '/assets/img/logos/Print_logo/forge_head.svg' | relative_url }}" alt="FORGE"></a>
      <a class="logo-carousel__item{% if page.nav_key == 'portfolio' %} is-active{% endif %}" href="{{ '/portfolio/' | relative_url }}" aria-label="Portfolio — 3D Art">
        <img src="{{ '/assets/img/logos/Portfolio/portfolio_head.svg' | relative_url }}" alt="Portfolio"></a>
      <a class="logo-carousel__item{% if page.nav_key == 'creator' %} is-active{% endif %}" href="{{ '/creator/' | relative_url }}" aria-label="Creator">
        <img src="{{ '/assets/img/logos/Creator/Creator_head_svg.svg' | relative_url }}" alt="Creator"></a>
    </div>

    <div class="header-wordmark">
      <a class="wm-name" href="{{ page.url | relative_url }}">{{ page.wordmark | default: 'CRAFTING YOUR TOMORROW' }}<span class="wm-dot">.</span></a>
    </div>

    <div class="header-controls">
      {% if page.has_translation %}<a class="lang-toggle" id="lang-toggle" href="{{ alt_href }}" data-target-lang="{{ alt_lang }}" aria-label="{{ site.data.i18n[page.lang].lang_toggle }}" title="{{ site.data.i18n[page.lang].lang_toggle }}">{% if page.lang == 'hu' %}<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.6 2.6 4 5.4 4 8.5s-1.4 5.9-4 8.5c-2.6-2.6-4-5.4-4-8.5s1.4-5.9 4-8.5z"/><path d="M12 13.6c-1.1 1.1-2.9 1.6-4.1 0.8c0.9 1.4 3.1 1.2 4.1-0.4c1 1.6 3.2 1.8 4.1 0.4c-1.2 0.8-3 0.3-4.1-0.8z" fill="currentColor" stroke="none"/></svg>{% else %}<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="6.5"/><path d="M5.5 15h13"/><path d="M12 8.5c1.9 1.9 3 4.1 3 6.5s-1.1 4.6-3 6.5c-1.9-1.9-3-4.1-3-6.5s1.1-4.6 3-6.5z"/><path d="M6 8h12"/><path d="M9 8V2.2h6V8"/><path d="M9 5.4h6"/></svg>{% endif %}</a>{% endif %}
      <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <img id="theme-toggle-icon" src="{{ '/assets/icons/Cupcake.svg' | relative_url }}" data-light="{{ '/assets/icons/Cupcake.svg' | relative_url }}" data-dark="{{ '/assets/icons/Planet.svg' | relative_url }}" alt="Toggle theme" width="20" height="20">
      </button>
      {% if page.subnav %}<button class="menu-toggle" id="menu-toggle" aria-label="Menu" aria-expanded="false">
        <span class="toggle-track"><span class="toggle-dot"></span></span>
      </button>{% endif %}
    </div>
  </div>
</header>
