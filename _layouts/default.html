<!DOCTYPE html>
<html lang="en" data-theme="light"{% if page.site_accent %} data-site="{{ page.site_accent }}"{% endif %}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/3PO_logo/base_whitefill.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/site-pages.css' | relative_url }}">
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme')==='dark'?'dark':'light');</script>
</head>
<body data-page="{{ page.nav_key }}">

  {% include page-arrows.html %}
  {% include site-header.html %}

  <main id="top">
    {{ content }}
  </main>

  {% include site-footer.html %}

  <script src="{{ '/assets/site.js' | relative_url }}"></script>
</body>
</html>
